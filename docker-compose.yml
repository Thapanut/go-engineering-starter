# Local development only. Credentials here are throwaway dev values.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: dev_only_password
      POSTGRES_DB: app
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      # Runs once on first start, in filename order. Mount each new migration's
      # .up.sql here (or run golang-migrate) and any synthetic dev seed after it.
      - ./migrations/dev/00_create_test_db.sql:/docker-entrypoint-initdb.d/00_create_test_db.sql:ro
      - ./migrations/0001_payments.up.sql:/docker-entrypoint-initdb.d/10_0001_payments.up.sql:ro
      - ./migrations/0002_outbox.up.sql:/docker-entrypoint-initdb.d/11_0002_outbox.up.sql:ro
      - ./migrations/0003_payment_checkout.up.sql:/docker-entrypoint-initdb.d/12_0003_payment_checkout.up.sql:ro
      - ./migrations/0004_catalog.up.sql:/docker-entrypoint-initdb.d/13_0004_catalog.up.sql:ro
      - ./migrations/0005_ordering.up.sql:/docker-entrypoint-initdb.d/14_0005_ordering.up.sql:ro
      - ./migrations/dev/20_seed_catalog.sql:/docker-entrypoint-initdb.d/20_seed_catalog.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Single-node Kafka (KRaft) for the outbox relay: KAFKA_BROKERS=localhost:9092.
  # Two listeners: PLAINTEXT advertises localhost:9092 for the host (keep the host port
  # at 9092), INTERNAL advertises kafka:29092 for other containers (kafka-ui).
  # Setting any KAFKA_* variable replaces the image defaults, so the full config is here.
  # Not started by `make verify`; use `make kafka-up` (also creates the topic).
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 30

  # Web UI for browsing topics and messages: http://localhost:8081 (`make kafka-ui`).
  # Host port 8081 because the API owns 8080; override with KAFKA_UI_PORT.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
