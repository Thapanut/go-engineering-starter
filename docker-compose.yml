# Local development only. Credentials here are throwaway dev values.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: dev_only_password
      POSTGRES_DB: app
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      # Runs once on first start, in filename order. Mount each new migration's
      # .up.sql here (or run golang-migrate) and any synthetic dev seed after it.
      - ./migrations/dev/00_create_test_db.sql:/docker-entrypoint-initdb.d/00_create_test_db.sql:ro
      - ./migrations/0001_payments.up.sql:/docker-entrypoint-initdb.d/10_0001_payments.up.sql:ro
      - ./migrations/0002_outbox.up.sql:/docker-entrypoint-initdb.d/11_0002_outbox.up.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Single-node Kafka (KRaft) for the outbox relay: KAFKA_BROKERS=localhost:9092.
  # The image's default config advertises localhost:9092, so keep the host port at 9092.
  # Not started by `make verify`; use `make kafka-up` (also creates the topics).
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 30
