asyncapi: 3.0.0
info:
  title: go-engineering-starter events
  version: 0.1.0
  description: |
    Events this service publishes to Kafka through the transactional outbox (ADR-0004).

    Delivery is **at-least-once**: a message can be delivered more than once, with the
    same `event_id`. Consumers must deduplicate on `event_id`. Messages with the same
    key (the payment id) go to the same partition, so they are consumed in order.

    The ordering module of this same service consumes them (consumer group `ordering`,
    ADR-0005) to mark orders PAID or PAYMENT_FAILED. Messages ordering can never apply
    go to its dead-letter topic; an Admin replays them into its retry topic (ADR-0004
    amendment 1).

    Specs: docs/02-specs/payment-events-outbox.md, docs/02-specs/order-flow-modules.md,
    docs/02-specs/ordering-consumer-dlq.md
defaultContentType: application/json

servers:
  kafka:
    host: "{brokers}"
    protocol: kafka
    description: Bootstrap brokers from the KAFKA_BROKERS environment variable.
    variables:
      brokers:
        description: Comma-separated host:port list, set per environment.

channels:
  paymentStatusChanged:
    address: payments.v1.status-changed
    description: A payment reached a final status (SUCCESS or FAILED). Published once per transition.
    messages:
      paymentStatusChanged:
        $ref: "#/components/messages/PaymentStatusChanged"
    bindings:
      kafka:
        bindingVersion: 0.5.0

  paymentStatusChangedOrderingDlq:
    address: payments.v1.status-changed.ordering.dlq
    description: |
      Messages the `ordering` consumer can never apply (undecodable or invalid), written
      before their source offset is committed. One partition, retention 14 days.
      Business outcomes (unknown order, amount mismatch, final order) never go here.
    messages:
      paymentStatusChangedDeadLetter:
        $ref: "#/components/messages/PaymentStatusChangedDeadLetter"
    bindings:
      kafka:
        bindingVersion: 0.5.0
        partitions: 1
  paymentStatusChangedOrderingRetry:
    address: payments.v1.status-changed.ordering.retry
    description: |
      Dead-lettered messages an Admin replayed with cmd/dlqreplay. Read only by consumer
      group `ordering`, together with payments.v1.status-changed. One partition.
    messages:
      paymentStatusChanged:
        $ref: "#/components/messages/PaymentStatusChanged"
    bindings:
      kafka:
        bindingVersion: 0.5.0
        partitions: 1
operations:
  publishPaymentStatusChanged:
    action: send
    channel:
      $ref: "#/channels/paymentStatusChanged"
    summary: Publish payment.status-changed after a payment transition commits.
    messages:
      - $ref: "#/channels/paymentStatusChanged/messages/paymentStatusChanged"
  consumePaymentStatusChangedForOrders:
    action: receive
    channel:
      $ref: "#/channels/paymentStatusChanged"
    summary: Ordering applies the payment outcome to its order (consumer group "ordering").
    description: |
      At-least-once: the offset is committed after the ordering transaction commits;
      event_id is recorded in ordering.processed_events in that transaction. The amount
      must equal the order total, otherwise the event is recorded and logged for
      reconciliation instead of being applied.
    messages:
      - $ref: "#/channels/paymentStatusChanged/messages/paymentStatusChanged"
  deadLetterPaymentStatusChangedForOrders:
    action: send
    channel:
      $ref: "#/channels/paymentStatusChangedOrderingDlq"
    summary: The ordering consumer parks a message it can never apply, then commits its source offset.
    messages:
      - $ref: "#/channels/paymentStatusChangedOrderingDlq/messages/paymentStatusChangedDeadLetter"
  replayDeadLetteredPaymentStatusChanged:
    action: send
    channel:
      $ref: "#/channels/paymentStatusChangedOrderingRetry"
    summary: An Admin republishes a dead-lettered message byte for byte, with dlq-replay-count + 1 (cmd/dlqreplay).
    messages:
      - $ref: "#/channels/paymentStatusChangedOrderingRetry/messages/paymentStatusChanged"
  consumeRetriedPaymentStatusChangedForOrders:
    action: receive
    channel:
      $ref: "#/channels/paymentStatusChangedOrderingRetry"
    summary: Ordering applies replayed events like source events (same group, same deduplication on event_id).
    messages:
      - $ref: "#/channels/paymentStatusChangedOrderingRetry/messages/paymentStatusChanged"
components:
  messages:
    PaymentStatusChangedDeadLetter:
      name: payment.status-changed.dead-letter
      title: Dead-lettered payment status change
      contentType: application/json
      summary: The original key, value, and headers, unchanged, plus the dlq-* headers. The payload is not validated (it may be malformed).
      headers:
        type: object
        required: [dlq-original-topic, dlq-original-partition, dlq-original-offset, dlq-consumer-group, dlq-reason, dlq-failed-at, dlq-replay-count]
        properties:
          event_id:
            type: string
            description: Copied from the original message when present.
          dlq-original-topic:
            type: string
            description: Topic the message was read from (the source or the retry topic).
          dlq-original-partition:
            type: string
            pattern: "^[0-9]+$"
          dlq-original-offset:
            type: string
            pattern: "^[0-9]+$"
          dlq-consumer-group:
            type: string
            const: ordering
          dlq-reason:
            type: string
            maxLength: 256
            description: Fixed text naming the problem; never payload values.
          dlq-failed-at:
            type: string
            format: date-time
          dlq-replay-count:
            type: string
            pattern: "^[0-9]+$"
            description: How many times this message had been replayed before this dead-letter.
      payload:
        description: The original message value, unchanged and not validated.
      bindings:
        kafka:
          bindingVersion: 0.5.0
          key:
            type: string
            description: The original key (payment_id).
    PaymentStatusChanged:
      name: payment.status-changed
      title: Payment status changed
      contentType: application/json
      headers:
        type: object
        properties:
          content-type:
            type: string
            const: application/json
          event_id:
            type: string
            format: uuid
            description: Same value as the payload's event_id.
      payload:
        $ref: "#/components/schemas/PaymentStatusChangedV1"
      bindings:
        kafka:
          bindingVersion: 0.5.0
          key:
            type: string
            format: uuid
            description: payment_id
      examples:
        - name: success
          payload:
            event_id: 7f0c2b1e-5d4a-4e8b-9a61-3c2d1e0f9a8b
            payment_id: 0e6a4f6e-6a1f-4f5e-9d6e-2b7f3c1a9d01
            order_id: 5b1d7c2e-8f3a-4c6b-9e0d-1a2b3c4d5e6f
            invoice_no: INV-0001
            status: SUCCESS
            amount: "230.87"
            amount_minor: 23087
            currency: THB
            provider_ref: "2868821"
            occurred_at: "2026-09-27T10:00:00Z"

  schemas:
    PaymentStatusChangedV1:
      type: object
      additionalProperties: false
      required: [event_id, payment_id, order_id, invoice_no, status, amount, amount_minor, currency, provider_ref, occurred_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: Unique per event. Deduplicate on this.
        payment_id:
          type: string
          format: uuid
        order_id:
          type: string
          description: The order this payment collects for (ordering module). Empty for payments not created by ordering (e.g. dev seed).
        invoice_no:
          type: string
          description: Our payment reference shared with the provider (2C2P invoiceNo).
        status:
          type: string
          enum: [SUCCESS, FAILED]
        amount:
          type: string
          pattern: "^\\d{1,15}\\.\\d{2}$"
          description: Amount in major units as a decimal string with two places, e.g. "230.87" THB. A string, never a float.
        amount_minor:
          type: integer
          format: int64
          minimum: 0
          description: The same amount in minor units (satang for THB), e.g. 23087 = 230.87 THB. Use this for arithmetic.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        provider_ref:
          type: string
          description: Provider transaction reference (2C2P tranRef).
        occurred_at:
          type: string
          format: date-time
          description: When the transition committed, UTC (RFC 3339).
