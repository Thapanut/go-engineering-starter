asyncapi: 3.0.0
info:
  title: go-engineering-starter events
  version: 0.1.0
  description: |
    Events this service publishes to Kafka through the transactional outbox (ADR-0004).

    Delivery is **at-least-once**: a message can be delivered more than once, with the
    same `event_id`. Consumers must deduplicate on `event_id`. Messages with the same
    key (the payment id) go to the same partition, so they are consumed in order.

    Spec: docs/02-specs/payment-events-outbox.md
defaultContentType: application/json

servers:
  kafka:
    host: "{brokers}"
    protocol: kafka
    description: Bootstrap brokers from the KAFKA_BROKERS environment variable.
    variables:
      brokers:
        description: Comma-separated host:port list, set per environment.

channels:
  paymentStatusChanged:
    address: payments.v1.status-changed
    description: A payment reached a final status (SUCCESS or FAILED). Published once per transition.
    messages:
      paymentStatusChanged:
        $ref: "#/components/messages/PaymentStatusChanged"
    bindings:
      kafka:
        bindingVersion: 0.5.0

operations:
  publishPaymentStatusChanged:
    action: send
    channel:
      $ref: "#/channels/paymentStatusChanged"
    summary: Publish payment.status-changed after a payment transition commits.
    messages:
      - $ref: "#/channels/paymentStatusChanged/messages/paymentStatusChanged"

components:
  messages:
    PaymentStatusChanged:
      name: payment.status-changed
      title: Payment status changed
      contentType: application/json
      headers:
        type: object
        properties:
          content-type:
            type: string
            const: application/json
          event_id:
            type: string
            format: uuid
            description: Same value as the payload's event_id.
      payload:
        $ref: "#/components/schemas/PaymentStatusChangedV1"
      bindings:
        kafka:
          bindingVersion: 0.5.0
          key:
            type: string
            format: uuid
            description: payment_id
      examples:
        - name: success
          payload:
            event_id: 7f0c2b1e-5d4a-4e8b-9a61-3c2d1e0f9a8b
            payment_id: 0e6a4f6e-6a1f-4f5e-9d6e-2b7f3c1a9d01
            invoice_no: INV-0001
            status: SUCCESS
            amount: "230.87"
            amount_minor: 23087
            currency: THB
            provider_ref: "2868821"
            occurred_at: "2026-09-27T10:00:00Z"

  schemas:
    PaymentStatusChangedV1:
      type: object
      additionalProperties: false
      required: [event_id, payment_id, invoice_no, status, amount, amount_minor, currency, provider_ref, occurred_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: Unique per event. Deduplicate on this.
        payment_id:
          type: string
          format: uuid
        invoice_no:
          type: string
          description: Our payment reference shared with the provider (2C2P invoiceNo).
        status:
          type: string
          enum: [SUCCESS, FAILED]
        amount:
          type: string
          pattern: "^\\d{1,15}\\.\\d{2}$"
          description: Amount in major units as a decimal string with two places, e.g. "230.87" THB. A string, never a float.
        amount_minor:
          type: integer
          format: int64
          minimum: 0
          description: The same amount in minor units (satang for THB), e.g. 23087 = 230.87 THB. Use this for arithmetic.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        provider_ref:
          type: string
          description: Provider transaction reference (2C2P tranRef).
        occurred_at:
          type: string
          format: date-time
          description: When the transition committed, UTC (RFC 3339).
