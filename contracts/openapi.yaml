openapi: 3.1.0
info:
  title: <Service name> API
  version: 0.1.0
  description: |
    Contract is the source of truth. Changes require human approval.
    Money amounts are integers in minor units (e.g. satang for THB). Never floats.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: health
    description: Liveness and readiness probes for the platform
  - name: webhooks
    description: Callbacks from payment providers, authenticated by signature
  - name: catalog
    description: Products and prices, owned by the catalog module
  - name: payments
    description: Status of the customer's payments (created by the ordering module)
  - name: demo
    description: Local demo diagnostics; present only with DEMO_UI_ENABLED=true
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [health]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe (dependencies reachable)
      tags: [health]
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ready }
        "503": { $ref: "#/components/responses/NotReady" }
  /webhooks/2c2p:
    post:
      operationId: receive2c2pPaymentNotification
      summary: 2C2P PGW v4 backend payment notification (idempotent)
      description: |
        Body is signed by 2C2P as a JWT (HS256 = HMAC-SHA256 with the merchant Secret Key).
        Redelivery of an already-applied notification returns 200 with outcome DUPLICATE
        and changes nothing. See docs/02-specs/2c2p-payment-webhook.md.
      tags: [webhooks]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: Compact JWT (HS256) whose claims carry merchantID, invoiceNo, amount, currencyCode, tranRef, respCode
      responses:
        "200":
          description: Notification accepted
          headers:
            X-Trace-Id: { $ref: "#/components/headers/TraceId" }
          content:
            application/json:
              schema:
                type: object
                required: [status, outcome]
                properties:
                  status: { type: string, enum: [OK] }
                  outcome: { type: string, enum: [PROCESSED, DUPLICATE, CONFLICT_IGNORED] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "INVALID_SIGNATURE"
          headers:
            X-Trace-Id: { $ref: "#/components/headers/TraceId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: "PAYMENT_MISMATCH (amount or currency differs from the stored payment)"
          headers:
            X-Trace-Id: { $ref: "#/components/headers/TraceId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/products:
    get:
      operationId: listProducts
      summary: Active products with their catalog prices
      tags: [catalog]
      responses:
        "200":
          description: Catalog
          headers:
            X-Trace-Id: { $ref: "#/components/headers/TraceId" }
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/payments/{invoiceNo}/status:
    get:
      operationId: getPaymentStatus
      summary: Current status of one of the caller's payments (for polling)
      tags: [payments]
      parameters:
        - name: invoiceNo
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Payment status
          headers:
            X-Trace-Id: { $ref: "#/components/headers/TraceId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/demo/payments/{invoiceNo}/events:
    get:
      operationId: getDemoPaymentEvents
      summary: Outbox events of one of the caller's payments (local demo only)
      description: |
        Exists only when the server runs with DEMO_UI_ENABLED=true (otherwise 404). Shows
        whether the payment.status-changed event is still in the outbox or was published,
        and where the relay publishes (kafka, in-process, or disabled).
      tags: [demo]
      parameters:
        - name: invoiceNo
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Events, oldest first
          headers:
            X-Trace-Id: { $ref: "#/components/headers/TraceId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoPaymentEvents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    TraceId:
      description: Correlation id; echoes the request's X-Trace-Id or a generated one
      schema: { type: string }
  responses:
    # Shared error responses for /v1 operations.
    BadRequest:
      description: "VALIDATION_ERROR"
      headers:
        X-Trace-Id: { $ref: "#/components/headers/TraceId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "UNAUTHORIZED"
      headers:
        X-Trace-Id: { $ref: "#/components/headers/TraceId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "NOT_FOUND (also returned for resources the caller does not own)"
      headers:
        X-Trace-Id: { $ref: "#/components/headers/TraceId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: "CONFLICT"
      headers:
        X-Trace-Id: { $ref: "#/components/headers/TraceId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: "INTERNAL_ERROR (no internal details are exposed)"
      headers:
        X-Trace-Id: { $ref: "#/components/headers/TraceId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: "PAYLOAD_TOO_LARGE (body over 16 KiB)"
      headers:
        X-Trace-Id: { $ref: "#/components/headers/TraceId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotReady:
      description: "NOT_READY"
      headers:
        X-Trace-Id: { $ref: "#/components/headers/TraceId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Money:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          type: integer
          format: int64
          description: Minor units. 150000 = 1,500.00 THB
          example: 150000
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          example: THB
    DemoPaymentEvents:
      type: object
      required: [publisher, events]
      properties:
        publisher: { type: string, enum: [kafka, in-process, disabled] }
        events:
          type: array
          items:
            type: object
            required: [eventId, topic, key, createdAt, publishedAt, payload]
            properties:
              eventId: { type: string, format: uuid }
              topic: { type: string }
              key: { type: string, description: payment id }
              createdAt: { type: string, format: date-time }
              publishedAt: { type: [string, "null"], format: date-time, description: null until the relay published it }
              payload: { type: object, description: "payment.status-changed payload, see contracts/asyncapi.yaml" }
    Product:
      type: object
      required: [productId, name, price, priceMinor, currency]
      properties:
        productId: { type: string, example: CERAMIC-MUG }
        name: { type: string }
        price: { $ref: "#/components/schemas/DecimalAmount" }
        priceMinor: { $ref: "#/components/schemas/AmountMinor" }
        currency: { $ref: "#/components/schemas/Currency" }
    DecimalAmount:
      type: string
      pattern: "^\\d{1,15}\\.\\d{2}$"
      description: |
        Amount in major units as a decimal string with two places, e.g. "1000.00" THB.
        A string, never a float.
      example: "1000.00"
    AmountMinor:
      type: integer
      format: int64
      description: The same amount in minor units (satang for THB), e.g. 100000 = 1,000.00 THB. Use this for arithmetic.
      example: 100000
    Currency:
      type: string
      pattern: "^[A-Z]{3}$"
      example: THB
    PaymentStatusValue:
      type: string
      enum: [PENDING, SUCCESS, FAILED]
    PaymentStatus:
      type: object
      required: [invoiceNo, orderId, status, amount, amountMinor, currency, updatedAt]
      properties:
        invoiceNo: { type: string }
        orderId: { type: string }
        status: { $ref: "#/components/schemas/PaymentStatusValue" }
        amount: { $ref: "#/components/schemas/DecimalAmount" }
        amountMinor: { $ref: "#/components/schemas/AmountMinor" }
        currency: { $ref: "#/components/schemas/Currency" }
        updatedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - NOT_FOUND
            - CONFLICT
            - INTERNAL_ERROR
            - NOT_READY
            - PAYLOAD_TOO_LARGE
            - INVALID_SIGNATURE
            - PAYMENT_MISMATCH
        message: { type: string }
        traceId: { type: string }
